
<style>
.gvrn-login-mark,
.brand-mark,
.logo-mark,
.portal-mark,
.hero-mark {
    animation: gvrnLogoFloat 4s ease-in-out infinite, gvrnLogoGlow 2.5s ease-in-out infinite !important;
    will-change: transform, box-shadow;
}

@keyframes gvrnLogoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.04); }
}

@keyframes gvrnLogoGlow {
    0%, 100% {
        box-shadow: 0 0 28px rgba(245,147,95,.35), 0 0 80px rgba(181,107,255,.18);
    }
    50% {
        box-shadow: 0 0 55px rgba(245,147,95,.75), 0 0 125px rgba(181,107,255,.45);
    }
}
</style>

{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="portal-label">GVRN Applications</div>
    <h2>{{ title }}</h2>
    <p>Please answer every question truthfully and completely.</p>

    <form method="post">
        {% for question in questions %}
            <label>{{ question }}</label>
            <textarea name="question_{{ loop.index0 }}" rows="4" placeholder="{{ question }}" required></textarea>
        {% endfor %}

        <button type="submit">Submit {{ title }}</button>
    </form>
</div>
{% endblock %}
