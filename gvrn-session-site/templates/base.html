<!doctype html>
<html>
<head>
    <title>GVRN Staff Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg: #050607;
            --panel: #0d1014;
            --panel-soft: #11151b;
            --border: #252b33;
            --text: #f4f4f5;
            --muted: #9ca3af;
            --muted-2: #6b7280;
            --accent: #d1d5db;
            --accent-dark: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 30% 45%, rgba(148, 163, 184, 0.14), transparent 26%),
                radial-gradient(circle at 75% 20%, rgba(75, 85, 99, 0.12), transparent 24%),
                var(--bg);
            color: var(--text);
        }

        header {
            padding: 22px 34px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(5, 6, 7, 0.72);
            backdrop-filter: blur(14px);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        main {
            width: min(1100px, calc(100% - 36px));
            margin: 36px auto;
        }

        .card {
            background: linear-gradient(180deg, rgba(17, 21, 27, 0.96), rgba(10, 13, 17, 0.96));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        p {
            color: var(--muted);
            line-height: 1.65;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 15px;
            margin: 0 0 18px;
            border: 1px solid #2d3542;
            border-radius: 10px;
            background: #0b0f17;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #9ca3af;
            box-shadow: 0 0 0 4px rgba(156, 163, 175, 0.12);
        }

        button, .btn {
            background: linear-gradient(135deg, #e5e7eb, #9ca3af);
            color: #08090b;
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }

        .btn-secondary {
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
        }

        .toplinks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .flash {
            background: rgba(127, 29, 29, 0.22);
            border: 1px solid rgba(239, 68, 68, 0.55);
            color: #fecaca;
            padding: 13px 15px;
            border-radius: 12px;
            margin-bottom: 18px;
        }

        small {
            color: var(--muted-2);
        }

        pre {
            background: #080b10;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            overflow: auto;
        }

        .login-shell {
            min-height: calc(100vh - 90px);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            align-items: center;
            gap: 70px;
        }

        .brand-side {
            text-align: center;
        }

        .brand-mark {
            width: 230px;
            height: 230px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle, rgba(229, 231, 235, 0.18), rgba(75, 85, 99, 0.08) 45%, transparent 70%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 0 85px rgba(148, 163, 184, 0.18);
            font-size: 54px;
            font-weight: 900;
            letter-spacing: -0.08em;
        }

        .brand-kicker {
            color: #cbd5e1;
            font-size: 13px;
            letter-spacing: 0.38em;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .brand-title {
            font-size: clamp(46px, 7vw, 82px);
            line-height: 0.95;
            margin: 0;
            font-weight: 950;
            letter-spacing: -0.06em;
        }

        .brand-title span {
            color: #cbd5e1;
        }

        .brand-subtitle {
            max-width: 580px;
            margin: 20px auto 0;
            color: #94a3b8;
            font-size: 18px;
        }

        .login-panel {
            max-width: 480px;
        }

        .login-panel .card {
            padding: 34px;
        }

        .portal-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .login-help {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 18px;
        }

        @media (max-width: 850px) {
            header {
                text-align: center;
            }

            .login-shell {
                grid-template-columns: 1fr;
                gap: 28px;
                padding-top: 20px;
            }

            .brand-mark {
                width: 150px;
                height: 150px;
                font-size: 38px;
            }

            .login-panel {
                max-width: none;
            }
        }
    </style>
</head>
<body>
<header>GVRN Staff Portal</header>
<main>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
</body>
</html>
<style>
.splash-screen {
    min-height: calc(100vh - 120px);
    display: grid;
    place-content: center;
    text-align: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
}
.splash-kicker {
    color: #cbd5e1;
    font-size: 16px;
    letter-spacing: 0.45em;
    font-weight: 900;
    margin-bottom: 24px;
}
.splash-title {
    font-size: clamp(64px, 10vw, 118px);
    line-height: 0.9;
    font-weight: 950;
    letter-spacing: -0.07em;
}
.splash-title span {
    color: #cbd5e1;
}
.splash-subtitle {
    color: #94a3b8;
    font-size: 18px;
    margin-top: 22px;
}
.splash-hide {
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
    position: absolute;
    inset: 0;
}
.hidden-login {
    display: none;
}
</style>
<style>
.account-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.2fr;
    gap: 10px;
    align-items: start;
}
.account-grid input,
.account-grid select {
    margin-bottom: 0;
}
.password-row {
    display: grid;
    grid-template-columns: 1fr 42px;
    gap: 8px;
}
.icon-btn {
    height: 48px;
    padding: 0;
    border-radius: 8px;
}
.account-grid button[type="submit"] {
    width: fit-content;
}
@media (max-width: 900px) {
    .account-grid {
        grid-template-columns: 1fr;
    }
}
</style>
