{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Staff Login</h2>
    <form method="post">
        <label>Username</label>
        <input name="username" required>

        <label>Password</label>
        <input name="password" type="password" required>

        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
