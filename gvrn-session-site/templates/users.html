{% extends "base.html" %}
{% block content %}
<div class="toplinks">
    <a class="btn btn-secondary" href="/dashboard">Back</a>
</div>

<div class="card">
    <div class="portal-label">New Account</div>

    <form method="post" class="account-grid">
        <input name="username" placeholder="Username" required>
        <input name="discord_user_id" placeholder="Discord User ID" required>

        <select name="role">
            <option value="staff">Normal Staff</option>
            <option value="admin">Admin</option>
        </select>

        <div class="password-row">
            <input id="passwordInput" name="password" placeholder="Password" required>
            <button type="button" class="icon-btn" onclick="randomPassword()">⟳</button>
        </div>

        <button type="submit">Create account</button>
    </form>
</div>

<h2>Accounts</h2>
{% for account in users %}
<div class="card">
    <b>{{ account.username }}</b>
    <p>Discord ID: {{ account.discord_user_id }}</p>
    <p>Role: {{ account.role }}</p>
    <form method="post" action="/admin/users/{{ account.id }}/delete" onsubmit="return confirm('Delete this account permanently?');">
        <button type="submit" class="delete-btn">Delete Account</button>
    </form>
</div>
{% endfor %}

<script>
function randomPassword() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$";
    let password = "";
    for (let i = 0; i < 12; i++) {
        password += chars[Math.floor(Math.random() * chars.length)];
    }
    document.getElementById("passwordInput").value = password;
}
</script>
{% endblock %}

<style>
.delete-btn {
    background: linear-gradient(135deg, #fb7185, #dc2626);
    color: white;
}
</style>
